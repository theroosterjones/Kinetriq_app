name: Kinetriq
options:
  bundleIdPrefix: com.kevinjones
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: false

packages:
  SwiftTasksVision:
    url: https://github.com/paescebu/SwiftTasksVision.git
    from: "0.10.14"
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: "5.78.0"

targets:
  Kinetriq:
    type: application
    platform: iOS
    sources:
      - path: Sources
    configFiles:
      Debug: Config/KinetriqSecrets.xcconfig
      Release: Config/KinetriqSecrets.xcconfig
    entitlements:
      path: Kinetriq.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    preBuildScripts:
      - name: Patch MediaPipe framework plist for App Store validation
        shell: /bin/sh
        script: |
          DERIVED_DATA_ROOT="${BUILD_DIR%/Build/*}"
          IOS_PLIST="${DERIVED_DATA_ROOT}/SourcePackages/checkouts/SwiftTasksVision/Dependencies/MediaPipeTasksVision.xcframework/ios-arm64/MediaPipeTasksVision.framework/Info.plist"
          SIM_PLIST="${DERIVED_DATA_ROOT}/SourcePackages/checkouts/SwiftTasksVision/Dependencies/MediaPipeTasksVision.xcframework/ios-arm64_x86_64-simulator/MediaPipeTasksVision.framework/Info.plist"
          
          MIN_OS="${IPHONEOS_DEPLOYMENT_TARGET:-17.0}"
          VERSION="${MARKETING_VERSION:-3.5.3}"
          BUILD="${CURRENT_PROJECT_VERSION:-46}"

          set_or_add() {
            local key="$1" val="$2" plist="$3"
            /usr/libexec/PlistBuddy -c "Set :${key} ${val}" "$plist" >/dev/null 2>&1 || \
            /usr/libexec/PlistBuddy -c "Add :${key} string ${val}" "$plist"
          }

          patch_plist() {
            plist_path="$1"
            if [ ! -f "$plist_path" ]; then
              return 0
            fi
            set_or_add "MinimumOSVersion"          "$MIN_OS"  "$plist_path"
            set_or_add "CFBundleShortVersionString" "$VERSION" "$plist_path"
            set_or_add "CFBundleVersion"            "$BUILD"   "$plist_path"
            echo "Pre-build patched $plist_path"
          }

          patch_plist "$IOS_PLIST"
          patch_plist "$SIM_PLIST"
    postBuildScripts:
      - name: Patch embedded MediaPipe framework plist for App Store validation
        shell: /bin/sh
        script: |
          # Locate the embedded framework plist — path differs between Debug and Archive builds.
          EMBEDDED_PLIST="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/MediaPipeTasksVision.framework/Info.plist"
          if [ ! -f "$EMBEDDED_PLIST" ]; then
            EMBEDDED_PLIST="${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/MediaPipeTasksVision.framework/Info.plist"
          fi
          if [ ! -f "$EMBEDDED_PLIST" ]; then
            echo "MediaPipeTasksVision Info.plist not found — skipping patch"
            exit 0
          fi

          # Use build-setting variables with hardcoded fallbacks in case they are not
          # exported into the script environment during Archive / Distribution builds.
          MIN_OS="${IPHONEOS_DEPLOYMENT_TARGET:-17.0}"
          VERSION="${MARKETING_VERSION:-3.5.3}"
          BUILD="${CURRENT_PROJECT_VERSION:-46}"

          set_or_add() {
            local key="$1" val="$2" plist="$3"
            /usr/libexec/PlistBuddy -c "Set :${key} ${val}" "$plist" >/dev/null 2>&1 || \
            /usr/libexec/PlistBuddy -c "Add :${key} string ${val}" "$plist"
          }

          /usr/libexec/PlistBuddy -c "Delete :AvailableLibraries"    "$EMBEDDED_PLIST" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c "Delete :XCFrameworkFormatVersion" "$EMBEDDED_PLIST" >/dev/null 2>&1 || true

          set_or_add "MinimumOSVersion"       "$MIN_OS"  "$EMBEDDED_PLIST"
          set_or_add "CFBundleShortVersionString" "$VERSION" "$EMBEDDED_PLIST"
          set_or_add "CFBundleVersion"        "$BUILD"   "$EMBEDDED_PLIST"
          set_or_add "CFBundlePackageType"    "FMWK"     "$EMBEDDED_PLIST"

          echo "Patched $EMBEDDED_PLIST — MinOS=$MIN_OS version=$VERSION build=$BUILD"
    settings:
      base:
        # Launch identity: migrated off the KevLines testing bundle ID to the new
        # Kinetriq App ID / App Store Connect record. The 3.5.x version lineage is
        # carried forward onto the new record (build numbering continues past the
        # last KevLines build, 34).
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinjones.Kinetriq
        PRODUCT_NAME: Kinetriq
        PRODUCT_MODULE_NAME: Kinetriq
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "3.5.3"
        CURRENT_PROJECT_VERSION: "46"
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: "Kinetriq"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Kinetriq needs access to your photo library to select exercise videos for analysis."
        INFOPLIST_KEY_NSCameraUsageDescription: "Kinetriq uses your camera for real-time exercise form analysis with skeleton overlay."
        # Custom config keys (RevenueCat/Supabase/legal URLs) live in this file —
        # INFOPLIST_KEY_* only injects Apple-known keys, not custom ones. Standard
        # keys are still produced by GENERATE_INFOPLIST_FILE and merged in.
        INFOPLIST_FILE: Kinetriq-Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: SwiftTasksVision
        product: SwiftTasksVision
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI

  KinetriqTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinjones.KinetriqTests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Kinetriq
